<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Sesi Pengujian - Secure Communication Lab</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        .login-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(15, 23, 42, 0.75);
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
        }

        .login-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(201, 238, 36, 0.2);
        }
    </style>
</head>

<body class="dashboard-theme">
    <main class="container" style="max-width: 520px; margin-top: 48px;">
        <div class="subnav-bar">
            <div class="breadcrumb-trail">
                <a href="/index.html">Beranda</a>
                <span>&gt;</span>
                <span class="current-crumb">Autentikasi Sesi</span>
            </div>
            <a href="/index.html" class="btn-back">&larr; Pilih Skema Lain</a>
        </div>

        <section class="panel-card top-lg">
            <div class="login-header-wrap"
                style="display: flex; flex-direction: column; align-items: center; text-align: left; margin-bottom: 20px;">
                <div style="
    width: 64px;
    height: 64px;
    margin-bottom: 14px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(59, 130, 246, 0.14);
    border: 1px solid rgba(59, 130, 246, 0.35);
    box-shadow: 0 8px 24px rgba(37, 99, 235, 0.18);
  ">
                    <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none"
                        stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                        <path d="M9 12l2 2 4-4" />
                    </svg>
                </div>
                <div style="width: 100%;">
                    <h1 style="margin: 0;">Akses Pengujian</h1>
                    <p class="card-desc top-sm" style="margin-bottom: 0;">
                        Masukkan kredensial untuk membuka halaman pengujian algoritma.
                    </p>
                </div>
            </div>

            <form id="login-form" class="manual-form-body">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input id="login-username" class="login-input" type="text"
                        placeholder="Masukkan username (contoh: admin)" autocomplete="username" required />
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input id="login-password" class="login-input" type="password" placeholder="Masukkan password"
                        autocomplete="current-password" required />
                </div>

                <p id="login-error-msg" class="helper-text text-danger" style="min-height: 20px;"></p>

                <button type="submit" class="btn-primary btn-full">
                    Masuk ke Halaman Pengujian &rarr;
                </button>
            </form>
        </section>
    </main>

    <script src="/js/login-page.js"></script>
</body>

</html>
